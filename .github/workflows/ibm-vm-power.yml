name: IBM VM Power

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - start
          - stop
          - status

      vmName:
        description: "Virtual machine name"
        required: true
        type: choice
        options:
          - vm-ibm-lab-1
          - vm-ibm-lab-2

  schedule:
    - cron: "0 20 * * *"
  
permissions: {}

env:
  IC_API_KEY: ${{ secrets.IC_API_KEY }}
  IBM_REGION: eu-de
  IBM_RESOURCE_GROUP: rg-ibm-lab

jobs:
  ibm-vm-power:
    name: IBM VM Power
    runs-on: ubuntu-latest

    steps:
      - name: Install IBM Cloud CLI
        shell: bash
        run: |
          curl -fsSL https://clis.cloud.ibm.com/install/linux | sh

      - name: Install VPC infrastructure plugin
        shell: bash
        run: |
          ibmcloud plugin install vpc-infrastructure -f

      - name: Login to IBM Cloud
        shell: bash
        run: |
          ibmcloud login \
            --apikey "$IC_API_KEY" \
            -r "$IBM_REGION" \
            -g "$IBM_RESOURCE_GROUP"

            - name: Perform action on virtual machine
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_VM_NAME: ${{ inputs.vmName }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            action="stop"
            vm_names=("vm-ibm-lab-1" "vm-ibm-lab-2")
          else
            action="$INPUT_ACTION"
            vm_names=("$INPUT_VM_NAME")
          fi

          for vm_name in "${vm_names[@]}"; do
            current_status="$(
              ibmcloud is instance "$vm_name" --output JSON |
                jq -r '.status'
            )"

            echo "VM: $vm_name"
            echo "Current status: $current_status"
            echo "Requested action: $action"

            case "$action" in
              start)
                if [[ "$current_status" == "stopped" ]]; then
                  ibmcloud is instance-start "$vm_name"
                else
                  echo "No action required: VM is $current_status"
                fi
                ;;

              stop)
                if [[ "$current_status" == "running" ]]; then
                  ibmcloud is instance-stop "$vm_name" --force
                else
                  echo "No action required: VM is $current_status"
                fi
                ;;

              status)
                echo "$vm_name is $current_status"
                ;;

              *)
                echo "::error::Invalid action: $action"
                exit 1
                ;;
            esac
          done
