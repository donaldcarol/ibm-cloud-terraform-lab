name: IBM Infrastructure Audit

on:
  workflow_dispatch:

permissions: {}

env:
  IC_API_KEY: ${{ secrets.IC_API_KEY }}
  IBM_REGION: eu-de
  IBM_RESOURCE_GROUP: rg-ibm-lab
  IBM_ADMIN_CIDR: ${{ vars.IBM_ADMIN_CIDR }}

jobs:
  ibm-infrastructure-audit:
    name: IBM Infrastructure Audit
    runs-on: ubuntu-latest

    steps:
      - name: Install IBM Cloud CLI
        shell: bash
        run: |
          curl -fsSL https://clis.cloud.ibm.com/install/linux | sh

      - name: Install VPC infrastructure plugin
        shell: bash
        run: |
          ibmcloud plugin install vpc-infrastructure -f

      - name: Login to IBM Cloud
        shell: bash
        run: |
          ibmcloud login \
            --apikey "$IC_API_KEY" \
            -r "$IBM_REGION" \
            -g "$IBM_RESOURCE_GROUP"

      - name: Perform infrastructure audit
        shell: bash
        run: |
          set -euo pipefail

          echo "Performing infrastructure audit..."

          instances_json="$(
          ibmcloud is instances --output JSON
          )"

          echo "$instances_json" |
          jq -r '.[] | [.name, .status, .zone.name, .profile.name] | @tsv'

          {
          echo "## IBM Cloud Infrastructure Audit"
          echo
          echo "| VM name | Status | Zone | Profile |"
          echo "|---|---|---|---|"

          echo "$instances_json" |
          jq -r '.[] | "| \(.name) | \(.status) | \(.zone.name) | \(.profile.name) |"'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: List security groups
        shell: bash
        run: |
          set -euo pipefail
          echo "Listing security groups..."
          ibmcloud is security-groups --vpc vpc-ibm-lab

      - name: Audit SSH rules
        shell: bash
        run: |
          set -euo pipefail
          
          echo "Inspecting SSH rules in sg-ibm-lab..."

          sg_json="$(
          ibmcloud is security-group sg-ibm-lab --output JSON
          )"

          echo "$sg_json" |
          jq -r '
          .rules[]
          | select(
            .direction == "inbound"
            and .protocol == "tcp"
            and .port_min <= 22
            and .port_max >= 22
          )
          | [.name, .remote.cidr_block, .port_min, .port_max]
          | @tsv
          '
          echo "Security groups attached to each VM:"

          for vm_name in vm-ibm-lab-1 vm-ibm-lab-2; do
          echo
          echo "VM: $vm_name"
        
           ibmcloud is instance "$vm_name" --output JSON |
            jq '.primary_network_interface.security_groups'
            done
          
          if echo "$sg_json" |
              jq -e '
                [
                  .rules[]
                  | select(
                      .direction == "inbound"
                      and .protocol == "tcp"
                      and .port_min <= 22
                      and .port_max >= 22
                      and (
                        .remote.cidr_block == "0.0.0.0/0"
                        or .remote.cidr_block == "::/0"
                      )
                    )
                ]
                | length > 0
              ' > /dev/null
            then
              echo "::error::SSH port 22 is exposed to the Internet"
            
              {
                echo
                echo "### SSH Security Check: ❌ FAIL"
                echo
                echo "Port 22 is accessible from \`0.0.0.0/0\` or \`::/0\`."
              } >> "$GITHUB_STEP_SUMMARY"
            
              exit 1
            else
              echo "SSH Security Check: PASS"
            
              {
                echo
                echo "### SSH Security Check: ✅ PASS"
                echo
                echo "Port 22 is not exposed to the entire Internet."
              } >> "$GITHUB_STEP_SUMMARY"
            fi

            if [[ -z "$IBM_ADMIN_CIDR" ]]; then
              echo "::error::GitHub variable IBM_ADMIN_CIDR is empty"
              exit 1
            fi
            
            if echo "$sg_json" |
              jq -e \
                --arg expected_cidr "$IBM_ADMIN_CIDR" \
                '
                  [
                    .rules[]
                    | select(
                        .direction == "inbound"
                        and .protocol == "tcp"
                        and .port_min <= 22
                        and .port_max >= 22
                        and .remote.cidr_block == $expected_cidr
                      )
                  ]
                  | length > 0
                ' > /dev/null
            then
              echo "Expected admin SSH rule found: $IBM_ADMIN_CIDR"
            
              {
                echo
                echo "### Admin SSH Rule: ✅ PASS"
                echo
                echo "Expected administrative CIDR found: \`$IBM_ADMIN_CIDR\`"
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Expected SSH rule not found for $IBM_ADMIN_CIDR"
            
              {
                echo
                echo "### Admin SSH Rule: ❌ FAIL"
                echo
                echo "Expected administrative CIDR not found: \`$IBM_ADMIN_CIDR\`"
              } >> "$GITHUB_STEP_SUMMARY"
            
              exit 1
            fi
                      
