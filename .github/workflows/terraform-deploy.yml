name: IBM Cloud Terraform Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ibm-terraform-state
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  IC_API_KEY: ${{ secrets.IC_API_KEY }}
  AWS_ACCESS_KEY_ID: ${{ secrets.COS_HMAC_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.COS_HMAC_SECRET_ACCESS_KEY }}

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.0
        
      - name: Create SSH public key file
        shell: bash
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          if [ -z "$SSH_PUBLIC_KEY" ]; then
            echo "::error::SSH_PUBLIC_KEY secret is missing"
            exit 1
          fi

          key_path="$RUNNER_TEMP/ibm-cloud-lab.pub"
          printf '%s\n' "$SSH_PUBLIC_KEY" > "$key_path"
          echo "TF_VAR_ssh_public_key_path=$key_path" >> "$GITHUB_ENV"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -out=tfplan -input=false -lock-timeout=5m

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v7
        with:
          name: ibm-terraform-plan
          path: terraform/tfplan
          retention-days: 1

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan

    environment:
      name: ibm-lab

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v7 

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.0

      - name: Create SSH public key file
        shell: bash
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          if [ -z "$SSH_PUBLIC_KEY" ]; then
            echo "::error::SSH_PUBLIC_KEY secret is missing"
            exit 1
          fi

          key_path="$RUNNER_TEMP/ibm-cloud-lab.pub"
          printf '%s\n' "$SSH_PUBLIC_KEY" > "$key_path"
          echo "TF_VAR_ssh_public_key_path=$key_path" >> "$GITHUB_ENV"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Download Terraform Plan
        uses: actions/download-artifact@v8 
        with:
          name: ibm-terraform-plan
          path: terraform

      - name: Verify Terraform Plan
        run: test -f tfplan

      - name: Terraform Apply
        run: terraform apply -input=false tfplan
